<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Network Builder - Jaringan Kabel dan Nirkabel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
/* ===========================================================
   NETWORK BUILDER - STYLE SHEET
   Tema: modern technology, cartoon educational, biru-hijau-putih
   =========================================================== */
:root{
  --blue: #2D8CE0;
  --blue-dark: #1B5FA8;
  --green: #2FBE7C;
  --green-dark: #1E9660;
  --white: #FFFFFF;
  --bg: #EAF4FF;
  --ink: #16324A;
  --muted: #5C7690;
  --card: #FFFFFF;
  --line: #D6E8FB;
  --danger: #EF5B5B;
  --warn: #F5A623;
  --radius: 18px;
}
:root[data-theme="dark"], :root:not([data-theme="light"]) {
  /* keep light theme as primary (kid-friendly bright theme), but respect explicit dark toggle if forced */
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0e1b2b; --card:#132a41; --ink:#eaf4ff; --muted:#8fb0cf; --line:#1e3b57;
  }
}
*{ box-sizing:border-box; }
html,body{ margin:0; padding:0; }
body{
  background: radial-gradient(circle at top left, #dff1ff 0%, var(--bg) 55%);
  color: var(--ink);
  font-family: 'Nunito', system-ui, sans-serif;
  min-height:100vh;
  padding: 18px 14px 50px;
}
h1,h2,h3{ font-family:'Fredoka', system-ui, sans-serif; margin:0; }
.wrap{ max-width: 920px; margin:0 auto; }

/* header */
.topbar{ display:flex; align-items:center; gap:14px; margin-bottom:14px; }
.mascot-mini{ width:52px; height:52px; flex:0 0 auto; }
.title-block h1{ font-size: clamp(22px,5vw,32px); color:var(--blue-dark); letter-spacing:0.01em; }
.title-block p{ margin:2px 0 0; color:var(--muted); font-size:13px; font-weight:700; }

nav.menu{
  display:grid; grid-template-columns:repeat(4,1fr); gap:8px; margin: 14px 0 18px;
}
nav.menu button{
  font-family:'Fredoka'; font-size:13px; font-weight:600;
  padding:12px 6px; border-radius: 14px; border:2px solid var(--line);
  background: var(--card); color: var(--blue-dark); cursor:pointer;
  display:flex; flex-direction:column; align-items:center; gap:4px;
}
nav.menu button.active{ background: var(--blue); color:#fff; border-color:var(--blue-dark); }
nav.menu button .emoji{ font-size:18px; }

.stage{ min-height: 320px; }

.card{
  background: var(--card);
  border: 2px solid var(--line);
  border-radius: var(--radius);
  padding: 22px;
  margin-bottom: 16px;
  box-shadow: 0 6px 0 var(--line);
}
.card h2{ font-size:21px; color:var(--blue-dark); margin-bottom:6px; }
.card .desc{ color:var(--muted); font-size:14px; line-height:1.5; margin-bottom:14px; }

.badge-pill{
  display:inline-flex; align-items:center; gap:6px;
  background: var(--green); color:#fff; font-weight:800; font-size:12px;
  padding:6px 12px; border-radius:999px; font-family:'Fredoka';
}

.progress-wrap{ margin-bottom:14px; }
.progress-label{ font-size:12px; font-weight:800; color:var(--muted); margin-bottom:4px; font-family:'Fredoka'; }
.progress-bar{ height:12px; border-radius:999px; background:var(--line); overflow:hidden; }
.progress-fill{ height:100%; background: linear-gradient(90deg, var(--green), var(--blue)); transition: width .3s ease; }

.icon-frame{
  width: 150px; height:150px; margin: 0 auto 16px; display:flex; align-items:center; justify-content:center;
  background: var(--bg); border-radius: 16px; border:2px solid var(--line);
}
.icon-frame svg{ width:100px; height:100px; }

.options{ display:grid; gap:10px; }
.opt{
  font-family:'Nunito'; font-weight:700; font-size:14px;
  padding:13px 16px; border-radius:14px; border:2px solid var(--line);
  background: var(--bg); color:var(--ink); cursor:pointer; text-align:left;
}
.opt:hover{ border-color: var(--blue); }
.opt.correct{ border-color: var(--green); background: rgba(47,190,124,0.15); }
.opt.wrong{ border-color: var(--danger); background: rgba(239,91,91,0.15); }
.opt[disabled]{ cursor:default; }

.feedback{ margin-top:12px; padding:12px 14px; border-radius:12px; font-weight:700; font-size:14px; display:none; }
.feedback.ok{ background: rgba(47,190,124,0.15); color:var(--green-dark); display:block; }
.feedback.bad{ background: rgba(239,91,91,0.15); color:#a83232; display:block; }
.materi-note{ margin-top:8px; font-size:13px; color:var(--muted); line-height:1.5; display:none; }
.materi-note.show{ display:block; }

.row{ display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin-top:16px; }
.btn{
  font-family:'Fredoka'; font-weight:600; font-size:14px;
  padding:11px 20px; border-radius:12px; border:2px solid var(--blue-dark);
  background: var(--blue); color:#fff; cursor:pointer;
}
.btn.secondary{ background:#fff; color:var(--blue-dark); }
.btn.green{ background:var(--green); border-color:var(--green-dark); }
.btn.ghost{ background:transparent; border-color:var(--line); color:var(--muted); }

/* level 3 cable builder */
.slots{ display:grid; grid-template-columns:repeat(8,1fr); gap:6px; margin:16px 0; }
.slot{
  aspect-ratio: 1/1.3; border:2px dashed var(--line); border-radius:10px;
  display:flex; align-items:center; justify-content:center; position:relative; cursor:pointer; background:var(--bg);
}
.slot .num{ position:absolute; top:3px; left:5px; font-size:9px; color:var(--muted); font-weight:800; }
.slot.filled{ border-style:solid; }
.chip{
  width:82%; height:58%; border-radius:8px; display:flex; align-items:center; justify-content:center;
  font-size:8px; text-align:center; font-weight:800; color:#0e1420; font-family:'Nunito'; line-height:1.15; padding:2px; cursor:pointer;
}
.pool{ display:flex; flex-wrap:wrap; gap:8px; margin-top:10px; padding:14px; background:var(--bg); border-radius:12px; border:2px solid var(--line); min-height:64px; }
.pool .chip{ width:64px; height:44px; }
.chip.selected{ outline:3px solid var(--ink); outline-offset:2px; }
.w-wo{ background: linear-gradient(180deg,#fff 45%, var(--warn) 45%); }
.w-o { background: var(--warn); }
.w-wg{ background: linear-gradient(180deg,#fff 45%, var(--green) 45%); }
.w-bl{ background: var(--blue); color:#fff; }
.w-wb{ background: linear-gradient(180deg,#fff 45%, var(--blue) 45%); }
.w-g { background: var(--green); }
.w-wbr{ background: linear-gradient(180deg,#fff 45%, #A9764C 45%); }
.w-br{ background: #A9764C; color:#fff; }

/* level 4 wifi sim */
.wifi-grid{ display:grid; grid-template-columns:repeat(6,1fr); gap:5px; margin:14px 0; }
.cell{
  aspect-ratio:1; border-radius:8px; border:2px solid var(--line); background:var(--bg);
  display:flex; align-items:center; justify-content:center; font-size:16px; cursor:pointer; position:relative;
}
.cell.covered{ background: rgba(47,190,124,0.28); }
.cell.router{ background: var(--blue); }
.cell.ap{ background: var(--green); }
.cell .stu{ position:absolute; font-size:13px; }
.pw-options{ display:grid; gap:8px; margin-top:10px; }
.pw-opt{ padding:11px 14px; border-radius:12px; border:2px solid var(--line); background:var(--bg); cursor:pointer; font-weight:700; font-size:13px; }
.pw-opt.picked{ border-color: var(--blue); background: rgba(45,140,224,0.15); }

.score-grid{ display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin:14px 0; }
.score-box{ background:var(--bg); border:2px solid var(--line); border-radius:12px; padding:12px; text-align:center; }
.score-box .n{ font-family:'Fredoka'; font-size:22px; color:var(--green-dark); }
.score-box .l{ font-size:10px; color:var(--muted); font-weight:800; margin-top:2px; }

.badges-wrap{ display:flex; flex-wrap:wrap; gap:10px; margin-top:10px; }
.badge-card{ flex:1 1 140px; background:var(--bg); border:2px dashed var(--blue); border-radius:14px; padding:14px; text-align:center; }
.badge-card .ic{ font-size:26px; }
.badge-card .nm{ font-family:'Fredoka'; font-size:13px; margin-top:4px; }
.badge-card.locked{ opacity:0.4; border-style:solid; border-color:var(--line); }

.materi-grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(220px,1fr)); gap:12px; }
.materi-card{ background:var(--bg); border:2px solid var(--line); border-radius:14px; padding:14px; }
.materi-card h3{ font-size:14px; color:var(--blue-dark); margin-bottom:6px; }
.materi-card p{ font-size:12.5px; color:var(--muted); line-height:1.5; margin:0; }

.name-gate{ text-align:center; padding: 40px 20px; }
.name-gate input{
  font-family:'Nunito'; font-size:15px; padding:12px 14px; border-radius:12px; border:2px solid var(--line);
  width:100%; max-width:320px; margin: 14px 0;
}
footer{ text-align:center; color:var(--muted); font-size:11px; margin-top:22px; }
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <div class="mascot-mini" id="mascotMini"></div>
    <div class="title-block">
      <h1>NETWORK BUILDER</h1>
      <p>Belajar Jaringan Komputer Melalui Permainan</p>
    </div>
  </div>

  <nav class="menu" id="mainNav">
    <button data-m="game"><span class="emoji">🎮</span>MULAI GAME</button>
    <button data-m="materi"><span class="emoji">📘</span>MATERI JARINGAN</button>
    <button data-m="quiz"><span class="emoji">❓</span>QUIZ</button>
    <button data-m="profil"><span class="emoji">🧑‍💻</span>PROFIL PEMAIN</button>
  </nav>

  <div class="stage" id="stage"></div>

  <footer>Network Builder &mdash; media belajar Jaringan Kabel dan Nirkabel untuk siswa SMK TKJ. Berjalan sepenuhnya offline di browser.</footer>
</div>

<script>

   4. Fungsi render tiap layar (menu, level 1-5, quiz, materi, profil)
   =========================================================== */

const ICONS = {

<rect x="18" y="48" width="8" height="10" rx="1"/><rect x="30" y="48" width="8" height="10" rx="1"/><rect x="42" y="48" width="8" height="10" rx="1"/><rect x="54" y="48" width="8" height="10" rx="1"/><rect x="66" y="48" width="8" height="10" rx="1"/></g>

<g fill="#F5A623"><rect x="34" y="26" width="4" height="16"/><rect x="40" y="26" width="4" height="16"/><rect x="46" y="26" width="4" height="16"/><rect x="52" y="26" width="4" height="16"/><rect x="58" y="26" width="4" height="16"/><rect x="64" y="26" width="4" height="16"/></g>

function iconHtml(key){ return ICONS[key] || ""; }

/* ---------- 2. BANK SOAL (30+ soal) ---------- */
// LEVEL 1: Kenali Perangkat Jaringan (identifikasi gambar)
const LEVEL1_QUESTIONS = [
  { image:"switch", text:"Perangkat ini digunakan untuk menghubungkan beberapa komputer dalam satu jaringan LAN.", options:["Router","Switch","Modem"], correct:1, materi:"Switch menghubungkan banyak perangkat dalam satu jaringan LAN dan meneruskan data hanya ke perangkat tujuan yang tepat." },
  { image:"router", text:"Perangkat ini mengatur jalur data antar jaringan yang berbeda, termasuk ke internet.", options:["Router","Server","RJ45"], correct:0, materi:"Router menghubungkan dan mengatur jalur lalu lintas data antar jaringan yang berbeda, misalnya jaringan lokal ke internet." },
  { image:"modem", text:"Perangkat ini mengubah sinyal dari penyedia layanan internet menjadi sinyal yang bisa dipakai jaringan lokal.", options:["Access Point","Modem","Fiber Optic"], correct:1, materi:"Modem (modulator-demodulator) mengubah sinyal dari ISP (kabel telepon/fiber) menjadi sinyal data yang bisa digunakan jaringan rumah/sekolah." },
  { image:"server", text:"Perangkat ini menyimpan dan melayani data/aplikasi untuk diakses banyak komputer client.", options:["Server","Switch","Modem"], correct:0, materi:"Server adalah komputer khusus yang menyediakan layanan (data, aplikasi, file) yang bisa diakses oleh banyak komputer client." },

  { image:"rj45", text:"Konektor ini dipasang di ujung kabel UTP agar bisa dicolokkan ke port jaringan.", options:["RJ45","HDMI","USB"], correct:0, materi:"RJ45 adalah konektor standar untuk kabel UTP, memiliki 8 pin yang harus disusun sesuai standar (T568A/T568B)." },

// LEVEL 2: Pilih Kabel yang Tepat (skenario)
const LEVEL2_QUESTIONS = [
  { text:"Sebuah laboratorium komputer ingin menghubungkan 20 PC dalam satu ruangan.", options:["UTP","Fiber Optic","HDMI"], correct:0, materi:"UTP adalah pilihan tepat dan ekonomis untuk jaringan LAN lokal dalam satu ruangan/gedung." },
  { text:"Dua gedung sekolah yang berjarak 300 meter perlu dihubungkan dengan kecepatan tinggi dan minim gangguan.", options:["Kabel UTP","Kabel Fiber Optic","Kabel Telepon"], correct:1, materi:"Fiber optic mampu menjangkau jarak jauh dengan kecepatan tinggi dan tidak terganggu interferensi elektromagnetik, cocok untuk antar gedung." },

  { text:"Menghubungkan komputer ke switch atau router.", options:["Kabel Straight","Kabel Crossover","Kabel Coaxial"], correct:0, materi:"Kabel Straight dipakai untuk menghubungkan perangkat berbeda jenis, misalnya PC ke switch/router." },
];

// LEVEL 5: Troubleshooting

  try{
    const raw = localStorage.getItem("nb_profile_v1");
    return raw ? JSON.parse(raw) : null;
  }catch(e){ return null; }
}
function saveProfile(p){
  try{ localStorage.setItem("nb_profile_v1", JSON.stringify(p)); }catch(e){}
}
let profile = loadProfile();

let state = {
  menu: "game",
  level: 1,
  l1:{ idx:0, score:0, answered:false },
  l2:{ idx:0, score:0, answered:false },
  l3:{ slots:Array(8).fill(null), pool:[], selected:null, checked:false, correctCount:0 },
  l5:{ idx:0, score:0, answered:false },
  l4:{ apPlaced:[], students:[], pwChoice:null, submitted:false, score:0 },
  quiz:{ set:[], idx:0, score:0, answered:false },

const T568B = ["wo","o","wg","bl","wb","g","wbr","br"];
const WIRE_LABEL = { wo:"Putih-Oranye", o:"Oranye", wg:"Putih-Hijau", bl:"Biru", wb:"Putih-Biru", g:"Hijau", wbr:"Putih-Coklat", br:"Coklat" };
const WIRE_CLASS = { wo:"w-wo", o:"w-o", wg:"w-wg", bl:"w-bl", wb:"w-wb", g:"w-g", wbr:"w-wbr", br:"w-br" };
function shuffledCable(){ const a=[...T568B]; for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }

function shuffleArr(arr){ const a=[...arr]; for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function pickRandom(arr, n){ return shuffleArr(arr).slice(0,n); }

  renderLevelNav();
  renderCurrentLevel();
}
function renderLevelNav(){
  const nav = document.getElementById('gameLevelNav');
  const labels = ["1 Perangkat","2 Kabel","3 Pasang RJ45","4 WiFi Sekolah","5 Troubleshoot"];
  nav.innerHTML = labels.map((lb,i)=>{
    const n=i+1;
    const active = state.level===n ? "background:var(--blue);color:#fff;" : "";

function gotoLevel(n){ state.level = n; renderLevelNav(); renderCurrentLevel(); }

}

/* LEVEL 3 - pasang kabel RJ45 */
function renderLevel3(){
  if(state.l3.pool.length===0 && !state.l3.checked) state.l3.pool = shuffledCable();
  const { slots, pool, selected } = state.l3;
  const used = slots.filter(Boolean);
  const poolItems = pool.filter(id => !used.includes(id));
  const box = document.getElementById('gameStage');
  const slotsHtml = slots.map((v,i)=>{
    if(v) return `<div class="slot filled" onclick="l3Unplace(${i})"><span class="num">${i+1}</span><div class="chip ${WIRE_CLASS[v]}">${WIRE_LABEL[v]}</div></div>`;
    return `<div class="slot" onclick="l3Place(${i})"><span class="num">${i+1}</span></div>`;
  }).join("");
  const poolHtml = poolItems.map(id=>{
    const sel = selected===id ? "selected" : "";
    return `<div class="chip ${WIRE_CLASS[id]} ${sel}" onclick="l3Select('${id}')">${WIRE_LABEL[id]}</div>`;
  }).join("") || '<span style="color:var(--muted);font-size:12px;">Semua kabel sudah dipasang.</span>';

  box.innerHTML = `<div class="card">${progressBar(3)}
    <h2>Pasang Kabel RJ45</h2>
    <p class="desc">Susun 8 kabel sesuai urutan standar T568B agar jaringan aktif. Pilih kabel, lalu ketuk slot pin tujuannya.</p>
    <div class="icon-frame">${iconHtml('rj45')}</div>
    <div class="slots">${slotsHtml}</div>
    <div class="pool">${poolHtml}</div>
    <div class="row">
      <button class="btn" onclick="checkL3()">Periksa & Aktifkan Jaringan</button>
      <button class="btn ghost" onclick="resetLevel3()">Acak Ulang</button>
    </div>
    <div class="feedback" id="l3fb"></div>
  </div>`;
}
function l3Select(id){ state.l3.selected = id; renderLevel3(); }
function l3Place(i){ if(!state.l3.selected) return; state.l3.slots[i]=state.l3.selected; state.l3.selected=null; renderLevel3(); }
function l3Unplace(i){ state.l3.slots[i]=null; renderLevel3(); }
function resetLevel3(){ state.l3={ slots:Array(8).fill(null), pool:shuffledCable(), selected:null, checked:false, correctCount:0 }; renderLevel3(); }
function checkL3(){
  const { slots } = state.l3;
  if(slots.some(s=>!s)){
    const fb=document.getElementById('l3fb'); fb.className="feedback bad"; fb.textContent="Lengkapi semua 8 slot dulu, ya!"; return;
  }
  let correct=0; slots.forEach((s,i)=>{ if(s===T568B[i]) correct++; });
  state.l3.checked=true; state.l3.correctCount=correct;
  const fb = document.getElementById('l3fb');
  if(correct===8){ fb.className="feedback ok"; fb.innerHTML="Jaringan aktif! Semua 8 pin benar. "+`<div class="row"><button class="btn green" onclick="gotoLevel(4)">Lanjut ke Level 4</button></div>`; }
  else { fb.className="feedback bad"; fb.textContent=`Jaringan belum aktif. ${correct}/8 pin sudah benar, cek lagi urutannya.`; }
}

/* LEVEL 4 - Bangun WiFi Sekolah (mini simulasi) */
const GRID_COLS=6, GRID_ROWS=4;
const ROUTER_CELL = 3; // posisi tetap router (baris0 kol3 -> index 3)
function ensureL4Init(){
  if(state.l4.students.length===0){
    const total = GRID_COLS*GRID_ROWS;
    const taken = new Set([ROUTER_CELL]);
    const students=[];
    while(students.length<8){
      const c = Math.floor(Math.random()*total);
      if(!taken.has(c)){ students.push(c); taken.add(c); }
    }
    state.l4.students = students;
  }
}
function cellDist(a,b){
  const ar=Math.floor(a/GRID_COLS), ac=a%GRID_COLS;
  const br=Math.floor(b/GRID_COLS), bc=b%GRID_COLS;
  return Math.max(Math.abs(ar-br), Math.abs(ac-bc));
}
function coveredCells(){
  const total = GRID_COLS*GRID_ROWS;
  const covered = new Set();
  for(let c=0;c<total;c++){
    if(cellDist(c,ROUTER_CELL)<=2) covered.add(c);
    state.l4.apPlaced.forEach(ap=>{ if(cellDist(c,ap)<=1) covered.add(c); });
  }
  return covered;
}
function renderLevel4(){
  ensureL4Init();
  const box = document.getElementById('gameStage');
  const covered = coveredCells();
  const total = GRID_COLS*GRID_ROWS;
  let cellsHtml = "";
  for(let i=0;i<total;i++){
    let cls = "cell";
    if(covered.has(i)) cls += " covered";
    if(i===ROUTER_CELL) cls += " router";
    else if(state.l4.apPlaced.includes(i)) cls += " ap";
    let inner = "";
    if(i===ROUTER_CELL) inner = "📡";
    else if(state.l4.apPlaced.includes(i)) inner = "📶";
    if(state.l4.students.includes(i)) inner += `<span class="stu">🧑‍🎓</span>`;
    cellsHtml += `<div class="${cls}" onclick="l4Click(${i})">${inner}</div>`;
  }
  const connected = state.l4.students.filter(s=>covered.has(s)).length;
  const pwOptions = [
    {label:"Lemah (12345678)", val:0},
    {label:"Sedang (Sekolah2024)", val:5},
    {label:"Kuat (Sk0l@h_TKJ!2024#)", val:10},
  ];
  const pwHtml = pwOptions.map((p,i)=>{
    const picked = state.l4.pwChoice===i ? "picked" : "";
    return `<div class="pw-opt ${picked}" onclick="l4Pw(${i})">${p.label}</div>`;
  }).join("");

  let resultHtml = "";
  if(state.l4.submitted){
    resultHtml = `<div class="feedback ok">Simulasi selesai! Skor Level 4: ${state.l4.score}/30
      <div class="row"><button class="btn green" onclick="gotoLevel(5)">Lanjut ke Level 5</button></div></div>`;
  }

  box.innerHTML = `<div class="card">${progressBar(4)}
    <h2>Bangun WiFi Sekolah</h2>
    <p class="desc">📡 Router sudah terpasang tetap di ruang server. Ketuk maksimal 2 sel kosong untuk memasang Access Point (📶) agar sinyal WiFi (area hijau) menjangkau lebih banyak siswa 🧑‍🎓. Lalu pilih password WiFi.</p>
    <div class="wifi-grid">${cellsHtml}</div>
    <p class="desc" style="margin-top:10px;">Jangkauan sinyal: <b>${covered.size}/${total} zona</b> &middot; Perangkat siswa terhubung: <b>${connected}/8</b></p>
    <div class="progress-label">PILIH KEAMANAN PASSWORD WIFI</div>
    <div class="pw-options">${pwHtml}</div>
    <div class="row"><button class="btn" onclick="submitL4()">Selesai & Hitung Skor</button><button class="btn ghost" onclick="resetLevel4()">Ulangi</button></div>
    ${resultHtml}
  </div>`;
}
function l4Click(i){
  if(state.l4.submitted) return;
  if(i===ROUTER_CELL || state.l4.students.includes(i)) return;
  const idx = state.l4.apPlaced.indexOf(i);
  if(idx>=0){ state.l4.apPlaced.splice(idx,1); }
  else{ if(state.l4.apPlaced.length<2) state.l4.apPlaced.push(i); }
  renderLevel4();
}
function l4Pw(i){ if(state.l4.submitted) return; state.l4.pwChoice=i; renderLevel4(); }
function submitL4(){
  if(state.l4.pwChoice===null){
    alert("Pilih dulu password WiFi-nya, ya!"); return;
  }
  const covered = coveredCells();
  const total = GRID_COLS*GRID_ROWS;
  const connected = state.l4.students.filter(s=>covered.has(s)).length;
  const coverageScore = Math.round((covered.size/total)*10);
  const connectedScore = Math.round((connected/8)*10);
  const pwScore = [0,5,10][state.l4.pwChoice];
  state.l4.score = coverageScore + connectedScore + pwScore;
  state.l4.submitted = true;
  renderLevel4();
}
function resetLevel4(){ state.l4={ apPlaced:[], students:[], pwChoice:null, submitted:false, score:0 }; renderLevel4(); }

/* LEVEL 5 */
function renderLevel5(){
  const {idx} = state.l5;
  const box = document.getElementById('gameStage');
  if(idx >= LEVEL5_QUESTIONS.length){
    finishCampaign();
    return;
  }
  const q = LEVEL5_QUESTIONS[idx];
  box.innerHTML = `<div class="card">${progressBar(5)}
    <h2>Troubleshooting Jaringan</h2>
    <p class="desc"><b>Kasus:</b> ${q.text}</p>
    <div class="options" id="l5opts">${q.options.map((o,i)=>`<button class="opt" onclick="answerL5(${i})">${o}</button>`).join("")}</div>
    <div class="feedback" id="l5fb"></div>
    <div class="materi-note" id="l5materi">${q.materi}</div>
    <div class="row" id="l5next" style="display:none;"><button class="btn green" onclick="nextL5()">Lanjut</button></div>
  </div>`;
}
function answerL5(i){
  const q = LEVEL5_QUESTIONS[state.l5.idx];
  if(state.l5.answered) return; state.l5.answered = true;
  const opts = document.querySelectorAll('#l5opts .opt');
  opts.forEach((el,j)=>{ el.setAttribute('disabled','true'); if(j===q.correct) el.classList.add('correct'); else if(j===i) el.classList.add('wrong'); });
  const fb = document.getElementById('l5fb');
  if(i===q.correct){ state.l5.score+=10; fb.className="feedback ok"; fb.textContent="Hebat! Kamu memahami konsep jaringan. +10 poin"; }
  else { fb.className="feedback bad"; fb.textContent="Coba pelajari kembali fungsi perangkat jaringan."; }
  document.getElementById('l5materi').classList.add('show');
  document.getElementById('l5next').style.display='flex';
}
function nextL5(){ state.l5.idx++; state.l5.answered=false; renderLevel5(); }
function resetLevel5(){ state.l5={idx:0,score:0,answered:false}; renderLevel5(); }

function finishCampaign(){
  const l1max = LEVEL1_QUESTIONS.length*10, l2max = LEVEL2_QUESTIONS.length*10, l3max=80, l4max=30, l5max=LEVEL5_QUESTIONS.length*10;
  const l1s=state.l1.score, l2s=state.l2.score, l3s=(state.l3.correctCount||0)*10, l4s=state.l4.score, l5s=state.l5.score;
  const total = l1s+l2s+l3s+l4s+l5s;
  const maxTotal = l1max+l2max+l3max+l4max+l5max;

  const newBadges = [];
  if((l2s+l3s) >= (l2max+l3max)*0.8) newBadges.push("Cable Expert");
  if(l4s >= l4max*0.8) newBadges.push("Wireless Master");
  if(total >= maxTotal*0.8) newBadges.push("Network Engineer");

  if(profile){
    profile.totalScore = Math.max(profile.totalScore||0, total);
    profile.badges = Array.from(new Set([...(profile.badges||[]), ...newBadges]));
    profile.lastPlayed = new Date().toLocaleDateString('id-ID');
    saveProfile(profile);
  }

  const box = document.getElementById('gameStage');
  const badgeMeta = {
    "Cable Expert": {ic:"🏆", nm:"Cable Expert"},
    "Wireless Master": {ic:"🏆", nm:"Wireless Master"},
    "Network Engineer": {ic:"🏆", nm:"Network Engineer"},
  };
  const allBadges = ["Cable Expert","Wireless Master","Network Engineer"];
  const badgesHtml = allBadges.map(b=>{
    const earned = newBadges.includes(b);
    return `<div class="badge-card ${earned?"":"locked"}"><div class="ic">${badgeMeta[b].ic}</div><div class="nm">${badgeMeta[b].nm}</div></div>`;
  }).join("");

  box.innerHTML = `<div class="card">
    <h2>Misi Selesai, ${profile.name}!</h2>
    <p class="desc">Berikut rekap hasil permainanmu di kelima level Network Builder.</p>
    <div class="score-grid">
      <div class="score-box"><div class="n">${l1s}/${l1max}</div><div class="l">PERANGKAT</div></div>
      <div class="score-box"><div class="n">${l2s}/${l2max}</div><div class="l">KABEL</div></div>
      <div class="score-box"><div class="n">${l3s}/${l3max}</div><div class="l">PASANG RJ45</div></div>
      <div class="score-box"><div class="n">${l4s}/${l4max}</div><div class="l">WIFI SEKOLAH</div></div>
      <div class="score-box"><div class="n">${l5s}/${l5max}</div><div class="l">TROUBLESHOOT</div></div>
      <div class="score-box"><div class="n">${total}/${maxTotal}</div><div class="l">TOTAL SKOR</div></div>
    </div>
    <div class="progress-label">BADGE DIPEROLEH</div>
    <div class="badges-wrap">${badgesHtml}</div>
    <div class="row"><button class="btn" onclick="restartCampaign()">Main Lagi dari Awal</button></div>
  </div>`;
}
function restartCampaign(){
  state.level=1;
  state.l1={idx:0,score:0,answered:false};
  state.l2={idx:0,score:0,answered:false};
  state.l3={ slots:Array(8).fill(null), pool:[], selected:null, checked:false, correctCount:0 };
  state.l4={ apPlaced:[], students:[], pwChoice:null, submitted:false, score:0 };
  state.l5={idx:0,score:0,answered:false};
  renderGame();
}

/* --- QUIZ (10 soal acak dari bank 30+) --- */
function renderQuiz(){
  if(state.quiz.set.length===0) state.quiz.set = pickRandom(QUIZ_BANK, 10);
  const { set, idx } = state.quiz;
  const box = document.getElementById('stage');
  if(idx >= set.length){
    if(profile){ profile.quizBest = Math.max(profile.quizBest||0, state.quiz.score); saveProfile(profile); }
    box.innerHTML = `<div class="card"><h2>Quiz selesai!</h2><p class="desc">Skor kamu: ${state.quiz.score}/${set.length*10}</p>
      <div class="row"><button class="btn" onclick="restartQuiz()">Main Quiz Lagi (soal acak baru)</button></div></div>`;
    return;
  }
  const q = set[idx];
  box.innerHTML = `<div class="card">
    <div class="progress-label">SOAL ${idx+1} / ${set.length} &middot; ${q.section}</div>
    <h2>${q.text}</h2>
    ${q.image ? `<div class="icon-frame">${iconHtml(q.image)}</div>` : ""}
    <div class="options" id="quizOpts">${q.options.map((o,i)=>`<button class="opt" onclick="answerQuiz(${i})">${o}</button>`).join("")}</div>
    <div class="feedback" id="quizFb"></div>
    <div class="materi-note" id="quizMateri">${q.materi}</div>
    <div class="row" id="quizNext" style="display:none;"><button class="btn green" onclick="nextQuiz()">Lanjut</button></div>
  </div>`;
}
function answerQuiz(i){
  const q = state.quiz.set[state.quiz.idx];
  if(state.quiz.answered) return; state.quiz.answered=true;
  const opts = document.querySelectorAll('#quizOpts .opt');
  opts.forEach((el,j)=>{ el.setAttribute('disabled','true'); if(j===q.correct) el.classList.add('correct'); else if(j===i) el.classList.add('wrong'); });
  const fb=document.getElementById('quizFb');
  if(i===q.correct){ state.quiz.score+=10; fb.className="feedback ok"; fb.textContent="Hebat! Kamu memahami konsep jaringan. +10 poin"; }
  else { fb.className="feedback bad"; fb.textContent="Coba pelajari kembali fungsi perangkat jaringan."; }
  document.getElementById('quizMateri').classList.add('show');
  document.getElementById('quizNext').style.display='flex';
}
function nextQuiz(){ state.quiz.idx++; state.quiz.answered=false; renderQuiz(); }
function restartQuiz(){ state.quiz={ set: pickRandom(QUIZ_BANK,10), idx:0, score:0, answered:false }; renderQuiz(); }

/* --- MATERI JARINGAN --- */
function renderMateri(){
  const box = document.getElementById('stage');
  box.innerHTML = `<div class="card">
    <h2>Materi Jaringan</h2>
    <p class="desc">Ringkasan istilah kunci jaringan kabel dan nirkabel. Baca dulu sebelum mencoba QUIZ atau MULAI GAME.</p>
    <div class="materi-grid">${MATERI_LIST.map(m=>`<div class="materi-card"><h3>${m.judul}</h3><p>${m.isi}</p></div>`).join("")}</div>
  </div>`;
}

/* --- PROFIL PEMAIN --- */
function renderProfil(){
  const box = document.getElementById('stage');
  const badgeMeta = { "Cable Expert":"🏆", "Wireless Master":"🏆", "Network Engineer":"🏆" };
  const badges = (profile.badges||[]);
  box.innerHTML = `<div class="card">
    <div style="width:90px;height:90px;margin:0 auto 10px;">${iconHtml('character')}</div>
    <h2 style="text-align:center;">${profile.name}</h2>
    <p class="desc" style="text-align:center;">Junior Network Engineer</p>
    <div class="score-grid">
      <div class="score-box"><div class="n">${profile.totalScore||0}</div><div class="l">SKOR TERBAIK MISI</div></div>
      <div class="score-box"><div class="n">${profile.quizBest||0}</div><div class="l">SKOR TERBAIK QUIZ</div></div>
      <div class="score-box"><div class="n">${badges.length}</div><div class="l">BADGE DIRAIH</div></div>
    </div>
    <div class="progress-label">KOLEKSI BADGE</div>
    <div class="badges-wrap">
      ${badges.length ? badges.map(b=>`<div class="badge-card"><div class="ic">${badgeMeta[b]||"🏆"}</div><div class="nm">${b}</div></div>`).join("")
        : '<p class="desc">Belum ada badge. Selesaikan misi di MULAI GAME untuk meraih badge pertamamu!</p>'}
    </div>
    <p class="desc" style="margin-top:14px;">Terakhir bermain: ${profile.lastPlayed || "-"}</p>
    <div class="row"><button class="btn ghost" onclick="resetProfile()">Ganti Nama / Reset Profil</button></div>
  </div>`;
}
function resetProfile(){
  if(confirm("Yakin ingin menghapus profil dan mulai dari awal?")){
    localStorage.removeItem("nb_profile_v1");
    profile = null;
    renderRoot();
  }
}

/* ---------- INIT ---------- */
renderRoot();
</script>
</body>
</html>
